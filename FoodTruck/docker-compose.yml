version: '3.8'
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "4200:80"
    depends_on:
      - api